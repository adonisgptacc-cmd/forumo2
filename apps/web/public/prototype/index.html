<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forumo — Prototype</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Palette variants (data-palette attr on .app) ── */
      [data-palette="forest"] {
        --accent: oklch(0.45 0.09 160);
        --accent-2: oklch(0.38 0.09 160);
        --accent-bg: oklch(0.94 0.03 160);
      }
      [data-palette="ink"] {
        --accent: oklch(0.28 0.03 260);
        --accent-2: oklch(0.2 0.03 260);
        --accent-bg: oklch(0.93 0.012 260);
      }
      [data-palette="cobalt"] {
        --accent: oklch(0.48 0.15 255);
        --accent-2: oklch(0.4 0.15 255);
        --accent-bg: oklch(0.94 0.04 255);
      }
      [data-palette="plum"] {
        --accent: oklch(0.42 0.13 340);
        --accent-2: oklch(0.34 0.13 340);
        --accent-bg: oklch(0.94 0.04 340);
      }
      [data-density="compact"] {
        --sp: 0.78;
      }
      [data-density="cozy"] {
        --sp: 1.18;
      }

      /* Reset */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        background: var(--bg, oklch(0.972 0.012 80));
        color: var(--ink, oklch(0.2 0.012 50));
        font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a {
        cursor: pointer;
      }

      /* Design tokens */
      :root {
        --bg: oklch(0.972 0.012 80);
        --surface: oklch(1 0 0);
        --surface-2: oklch(0.955 0.014 80);
        --ink: oklch(0.2 0.012 50);
        --ink-2: oklch(0.38 0.012 50);
        --ink-3: oklch(0.55 0.01 50);
        --line: oklch(0.9 0.01 80);
        --line-2: oklch(0.83 0.01 80);
        --accent: oklch(0.58 0.14 40);
        --accent-2: oklch(0.5 0.14 40);
        --accent-bg: oklch(0.94 0.04 50);
        --escrow: oklch(0.5 0.07 155);
        --escrow-bg: oklch(0.94 0.035 155);
        --warn: oklch(0.65 0.14 75);
        --warn-bg: oklch(0.95 0.05 80);
        --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
        --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        --sp: 1;
        --r-sm: 6px;
        --r: 10px;
        --r-lg: 14px;
        --r-xl: 20px;
      }

      /* Layout */
      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 calc(32px * var(--sp));
        width: 100%;
      }
      .container-narrow {
        max-width: 980px;
        margin: 0 auto;
        padding: 0 calc(32px * var(--sp));
        width: 100%;
      }

      /* Top bar */
      .topbar {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .topbar-inner {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: calc(20px * var(--sp));
        padding: calc(14px * var(--sp)) 0;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 4px;
        font-family: var(--serif);
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .brand-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
        align-self: center;
      }
      .brand-tld {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
        letter-spacing: 0;
      }
      .search {
        display: flex;
        align-items: center;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 6px 0 16px;
        height: 44px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .search:focus-within {
        border-color: var(--ink-2);
        background: var(--surface);
      }
      .search svg {
        width: 16px;
        height: 16px;
        color: var(--ink-3);
        flex-shrink: 0;
      }
      .search input {
        flex: 1;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 0 12px;
        font-size: 14px;
        min-width: 0;
        font-family: inherit;
        color: inherit;
      }
      .search-cat {
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 12px;
        color: var(--ink-2);
        padding: 0 8px;
        border-left: 1px solid var(--line);
        height: 22px;
        font-family: inherit;
        cursor: pointer;
      }
      .search-btn {
        height: 32px;
        padding: 0 16px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        font-weight: 500;
        font-size: 13px;
        border: none;
        cursor: pointer;
        font-family: inherit;
      }
      .nav-actions {
        display: flex;
        align-items: center;
        gap: calc(4px * var(--sp));
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--ink-2);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .nav-link:hover {
        background: var(--surface-2);
        color: var(--ink);
      }
      .nav-link svg {
        width: 18px;
        height: 18px;
      }
      .cart-badge {
        background: var(--accent);
        color: white;
        font-family: var(--mono);
        font-size: 10px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
      }
      .subnav {
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }
      .subnav-inner {
        display: flex;
        gap: 4px;
        padding: 4px 0;
        overflow-x: auto;
      }
      .subnav-item {
        padding: 8px 14px;
        font-size: 13px;
        color: var(--ink-2);
        white-space: nowrap;
        border-radius: 8px;
        cursor: pointer;
      }
      .subnav-item:hover {
        background: var(--surface-2);
        color: var(--ink);
      }
      .subnav-item.active {
        color: var(--ink);
        font-weight: 500;
      }
      .subnav-item.sell {
        color: var(--accent);
        font-weight: 500;
      }

      /* Typography */
      .eyebrow {
        font-family: var(--mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-3);
      }
      .h-display {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(36px, 5vw, 56px);
        line-height: 1.05;
        letter-spacing: -0.025em;
      }
      .h1 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .h2 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: -0.015em;
      }
      .h3 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.005em;
      }
      .mono {
        font-family: var(--mono);
      }
      .muted {
        color: var(--ink-3);
      }
      .subtle {
        color: var(--ink-2);
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 40px;
        padding: 0 18px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        transition:
          background 0.12s,
          border-color 0.12s,
          transform 0.05s;
        border: 1px solid transparent;
        white-space: nowrap;
        cursor: pointer;
        font-family: inherit;
      }
      .btn:active {
        transform: translateY(0.5px);
      }
      .btn-primary {
        background: var(--accent);
        color: white;
      }
      .btn-primary:hover {
        background: var(--accent-2);
      }
      .btn-ink {
        background: var(--ink);
        color: var(--bg);
      }
      .btn-ink:hover {
        background: oklch(0.3 0.012 50);
      }
      .btn-ghost {
        border-color: var(--line-2);
        background: transparent;
      }
      .btn-ghost:hover {
        background: var(--surface-2);
        border-color: var(--ink-3);
      }
      .btn-soft {
        background: var(--surface-2);
        border-color: var(--line);
      }
      .btn-soft:hover {
        background: var(--surface);
        border-color: var(--ink-3);
      }
      .btn-sm {
        height: 32px;
        padding: 0 12px;
        font-size: 13px;
        border-radius: 8px;
      }
      .btn-lg {
        height: 48px;
        padding: 0 22px;
        font-size: 15px;
        border-radius: 12px;
      }
      .btn-block {
        width: 100%;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: transparent;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }

      /* Cards */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
      }
      .card-pad {
        padding: calc(20px * var(--sp));
      }
      .card-hover {
        transition:
          border-color 0.12s,
          transform 0.12s,
          box-shadow 0.12s;
      }
      .card-hover:hover {
        border-color: var(--ink-3);
        transform: translateY(-1px);
        box-shadow: 0 12px 24px -16px rgba(0, 0, 0, 0.12);
      }

      /* Pills / chips */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        background: var(--surface-2);
        color: var(--ink-2);
        border: 1px solid var(--line);
      }
      .pill-accent {
        background: var(--accent-bg);
        color: var(--accent-2);
        border-color: transparent;
      }
      .pill-escrow {
        background: var(--escrow-bg);
        color: var(--escrow);
        border-color: transparent;
      }
      .pill-warn {
        background: var(--warn-bg);
        color: oklch(0.45 0.14 60);
        border-color: transparent;
      }
      .pill-dot::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
      }
      .chip {
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-2);
        border: 1px solid var(--line);
        background: var(--surface);
        white-space: nowrap;
        cursor: pointer;
      }
      .chip:hover {
        border-color: var(--ink-3);
        color: var(--ink);
      }
      .chip.active {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .verified-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 500;
        color: var(--escrow);
      }
      .verified-badge svg {
        width: 12px;
        height: 12px;
      }

      /* Placeholder */
      .ph {
        position: relative;
        overflow: hidden;
        background: repeating-linear-gradient(
          135deg,
          oklch(0.92 0.014 80) 0 6px,
          oklch(0.95 0.014 80) 6px 12px
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-3);
      }
      .ph-label {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        background: rgba(255, 255, 255, 0.85);
        padding: 4px 8px;
        border-radius: 4px;
      }

      /* Listing card */
      .listing-card {
        display: flex;
        flex-direction: column;
        cursor: pointer;
      }
      .listing-card .ph {
        aspect-ratio: 1/1;
        border-radius: var(--r-lg) var(--r-lg) 0 0;
        border-bottom: 1px solid var(--line);
      }
      .listing-card .body {
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .listing-card .price {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 500;
        color: var(--ink);
        margin-top: 4px;
      }
      .listing-card .title {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 2.7em;
      }
      .listing-card .meta {
        font-size: 12px;
        color: var(--ink-3);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .listing-card[data-style="image-led"] .ph {
        aspect-ratio: 4/5;
        border-radius: var(--r-lg);
        border: 0;
      }
      .listing-card[data-style="image-led"] {
        background: transparent;
        border: 0;
      }
      .listing-card[data-style="image-led"] .body {
        padding: 12px 4px 0;
      }
      .listing-card[data-style="image-led"]:hover {
        transform: none;
        box-shadow: none;
      }

      /* Trust strip */
      .trust-strip {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        overflow: hidden;
      }
      .trust-cell {
        background: var(--surface);
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .trust-cell .num {
        font-family: var(--serif);
        font-size: 28px;
        line-height: 1;
      }
      .trust-cell .lbl {
        font-size: 12px;
        color: var(--ink-2);
      }

      /* Escrow timeline */
      .escrow-timeline {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        position: relative;
        padding: 12px 0;
      }
      .escrow-timeline::before {
        content: "";
        position: absolute;
        left: 12.5%;
        right: 12.5%;
        top: 32px;
        height: 2px;
        background: var(--line);
        z-index: 0;
      }
      .escrow-timeline.show-progress::after {
        content: "";
        position: absolute;
        left: 12.5%;
        top: 32px;
        height: 2px;
        background: var(--escrow);
        width: var(--progress, 0%);
        z-index: 1;
        transition: width 0.6s ease;
      }
      .escrow-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        position: relative;
        z-index: 2;
        text-align: center;
      }
      .escrow-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-3);
        transition: all 0.3s;
      }
      .escrow-step.done .escrow-dot {
        background: var(--escrow);
        border-color: var(--escrow);
        color: white;
      }
      .escrow-step.active .escrow-dot {
        background: var(--surface);
        border-color: var(--escrow);
        color: var(--escrow);
        box-shadow: 0 0 0 4px var(--escrow-bg);
      }
      .escrow-step .step-label {
        font-size: 12px;
        font-weight: 500;
      }
      .escrow-step .step-meta {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-3);
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.8;
        }
        100% {
          transform: scale(1.8);
          opacity: 0;
        }
      }

      /* Forms */
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font-size: 12px;
        color: var(--ink-2);
        font-weight: 500;
      }
      .field input,
      .field select,
      .field textarea {
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line-2);
        border-radius: 10px;
        background: var(--surface);
        outline: 0;
        font-size: 14px;
        width: 100%;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .field textarea {
        height: auto;
        padding: 10px 12px;
        resize: vertical;
        min-height: 96px;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--ink-2);
        box-shadow: 0 0 0 3px oklch(0.9 0.012 50);
      }

      /* Helpers */
      .divider {
        height: 1px;
        background: var(--line);
        border: 0;
        margin: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: calc(12px * var(--sp));
      }
      .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: calc(12px * var(--sp));
      }
      .grid {
        display: grid;
        gap: calc(16px * var(--sp));
      }
      .scrollbar-none {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }

      /* Cart */
      .cart-line {
        display: grid;
        grid-template-columns: 96px 1fr auto;
        gap: 16px;
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
      }
      .cart-line:last-child {
        border-bottom: 0;
      }
      .cart-line .ph {
        aspect-ratio: 1;
        border-radius: 10px;
      }
      .qty {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        height: 32px;
      }
      .qty button {
        width: 32px;
        height: 32px;
        color: var(--ink-2);
      }
      .qty button:hover {
        color: var(--ink);
        background: var(--surface-2);
      }
      .qty span {
        padding: 0 10px;
        font-family: var(--mono);
        font-size: 13px;
        min-width: 20px;
        text-align: center;
      }
      .seller-group {
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        background: var(--surface);
        overflow: hidden;
      }
      .seller-group-header {
        padding: 16px 20px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .seller-group-body {
        padding: 0 20px;
      }
      .seller-group-footer {
        padding: 16px 20px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--surface-2);
      }

      /* Animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-up {
        animation: fadeUp 0.35s ease-out both;
      }

      /* Trust data attrs */
      [data-trust="subtle"] .trust-strip,
      [data-trust="subtle"] .home-trust-pillar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React + Babel (browser) -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load order matters: data → components → tweaks → screens → screens2 → prototype -->
    <script type="text/babel" src="data.jsx"></script>
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel" src="screens.jsx"></script>
    <script type="text/babel" src="screens2.jsx"></script>
    <script type="text/babel" src="prototype.jsx"></script>
  </body>
</html>
