name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, web, mobile, shared]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forumo
          POSTGRES_PASSWORD: forumo
          POSTGRES_DB: forumo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forumo" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        run: |
          if [ "${{ matrix.package }}" = "backend" ]; then
            pnpm turbo run test:coverage --filter=backend
          else
            pnpm turbo run test --filter=${{ matrix.package }}
          fi
      - name: Upload coverage to Codecov
        if: matrix.package == 'backend'
        uses: codecov/codecov-action@v4
        with:
          files: apps/backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.test.yml up -d
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: playwright-report
      - run: docker compose -f docker-compose.test.yml down

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Backend TypeScript type-check
        run: pnpm --filter backend build

  security:
    name: Security & Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high || true
      - uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
      - uses: GitGuardian/ggshield-action@v1.29.0
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  preview:
    name: Preview Deployments
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: echo "Build preview images and deploy to ephemeral environment"

  mobile-e2e:
    name: Mobile E2E (iOS Simulator)
    runs-on: macos-14
    # Only run on main/develop — exclude staging pushes to manage runner costs
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    continue-on-error: true # TODO: set to false once mobile app reaches beta
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install detox-cli
        run: npm install -g detox-cli

      - name: Start Metro bundler
        working-directory: apps/mobile
        run: pnpm start &

      - name: Build (Detox)
        working-directory: apps/mobile
        run: detox build --configuration ios.sim.debug

      - name: Test (Detox)
        working-directory: apps/mobile
        run: detox test --configuration ios.sim.debug
