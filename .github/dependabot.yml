version: 2
updates:
  # Root workspace + all apps (pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      nextjs:
        patterns:
          - "next"
          - "@next/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      testing:
        patterns:
          - "jest*"
          - "@jest/*"
          - "playwright"
          - "@playwright/*"
          - "vitest*"

  # Python moderation service
  - package-ecosystem: "pip"
    directory: "/apps/moderation-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/apps/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/apps/moderation-service"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
