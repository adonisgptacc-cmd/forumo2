# Local development stack only — never used for production deployment.
# Every credential below is a placeholder default, overridable without
# editing this tracked file by creating a git-ignored `.env` in the repo
# root (Compose loads it automatically), e.g.:
#   POSTGRES_PASSWORD=something-else
#   JWT_SECRET=something-else
services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    container_name: forumo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-forumo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-forumo}
      - POSTGRES_DB=${POSTGRES_DB:-forumo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forumo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forumo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: forumo-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: forumo-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: forumo-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  # --- Applications ---
  moderation:
    build:
      context: ./apps/moderation-service
      dockerfile: Dockerfile
    container_name: forumo-moderation
    environment:
      - MODERATION_INTERNAL_TOKEN=${MODERATION_INTERNAL_TOKEN:-dev-moderation-token}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:5005/healthz'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: forumo-backend
    environment:
      # Overrides the image's baked-in NODE_ENV=production default (see
      # apps/backend/Dockerfile) — that value activates strict production
      # secret validation in apps/backend/src/config/config.schema.ts that
      # this dev stack intentionally does not supply.
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-forumo}:${POSTGRES_PASSWORD:-forumo}@postgres:5432/${POSTGRES_DB:-forumo}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-super-secret-key-change-in-prod}
      - MODERATION_SERVICE_URL=http://moderation:5005
      - MODERATION_INTERNAL_TOKEN=${MODERATION_INTERNAL_TOKEN:-dev-moderation-token}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - UPLOADS_BUCKET=forumo-uploads
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      moderation:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:4000/api/v1/health/ready'', r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: forumo-web
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/'', r => process.exit(r.statusCode < 500 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
