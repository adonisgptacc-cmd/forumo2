apiVersion: v1
kind: ConfigMap
metadata:
  name: forumo-config
  namespace: forumo
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_BASE_URL: "http://forumo-backend:4000/api/v1"
  MODERATION_SERVICE_URL: "http://forumo-moderation:5005"
  REDIS_URL: "redis://forumo-redis:6379"
  PORT: "4000"
---
apiVersion: v1
kind: Secret
metadata:
  name: forumo-secrets
  namespace: forumo
type: Opaque
stringData:
  DATABASE_URL: "postgresql://forumo:forumo@forumo-postgres:5432/forumo?schema=public"
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  NEXTAUTH_SECRET: "your-nextauth-secret-change-in-production"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
  POSTGRES_USER: "forumo"
  POSTGRES_PASSWORD: "forumo"
  POSTGRES_DB: "forumo"
