# ClusterSecretStore — authenticates to AWS Secrets Manager via IRSA.
# The IAM role ARN is annotated on the external-secrets ServiceAccount in the
# external-secrets namespace; the SecretStore references that SA.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: forumo-aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Backend secret — maps every key from apps/backend/.env.example to the
