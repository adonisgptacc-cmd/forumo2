# Web secret — maps every key from apps/web/.env.example to the
# forumo-web-secrets Kubernetes Secret consumed by the web Deployment.
# Note: NEXT_PUBLIC_* vars must also be present at image build time;
# pass them as Docker build-args in your CI pipeline in addition to this Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forumo-web-secrets
  namespace: forumo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: forumo-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: forumo-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: forumo/production/web
        property: NEXTAUTH_SECRET
    - secretKey: NEXTAUTH_URL
      remoteRef:
        key: forumo/production/web
        property: NEXTAUTH_URL
    - secretKey: NEXT_PUBLIC_SITE_URL
      remoteRef:
        key: forumo/production/web
        property: NEXT_PUBLIC_SITE_URL
    - secretKey: NEXT_PUBLIC_API_URL
      remoteRef:
        key: forumo/production/web
        property: NEXT_PUBLIC_API_URL
    - secretKey: NEXT_PUBLIC_API_BASE_URL
      remoteRef:
        key: forumo/production/web
        property: NEXT_PUBLIC_API_BASE_URL
    - secretKey: NEXT_PUBLIC_WS_URL
      remoteRef:
        key: forumo/production/web
        property: NEXT_PUBLIC_WS_URL
    - secretKey: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      remoteRef:
        key: forumo/production/web
        property: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    - secretKey: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
      remoteRef:
        key: forumo/production/web
        property: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
    - secretKey: NEXT_PUBLIC_ENVIRONMENT
