apiVersion: v1
kind: Namespace
metadata:
  name: forumo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forumo-backend
  namespace: forumo
  labels:
    app: forumo-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forumo-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: forumo-backend
        tier: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          # Replace with your ECR URI before deploying:
          #   <account>.dkr.ecr.<region>.amazonaws.com/forumo-backend:<git-sha>
          image: forumo/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - secretRef:
                name: forumo-backend-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                # Allow in-flight requests to drain before SIGTERM is sent
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: forumo-backend
  namespace: forumo
  labels:
    app: forumo-backend
spec:
  type: ClusterIP
  selector:
    app: forumo-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
