# Local-development ingress for forumo.local and api.forumo.local.
# Production uses k8s/ingress.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forumo-ingress
  namespace: forumo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    # Main web application
    - host: forumo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forumo-web
                port:
                  number: 3000
    # API endpoint
    - host: api.forumo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forumo-backend
                port:
                  number: 4000
---
# Alternative: NodePort services for local development without ingress controller
apiVersion: v1
kind: Service
metadata:
  name: forumo-web-nodeport
  namespace: forumo
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: forumo-backend-nodeport
  namespace: forumo
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30040
