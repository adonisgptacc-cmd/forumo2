packages:
  - "apps/*"
  - "packages/*"

storeDir: .pnpm-store
enableGlobalVirtualStore: false
verifyDepsBeforeRun: warn

allowBuilds:
  "@nestjs/core": false
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": false
  bcrypt: true
  detox: true
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: false
  msw: false
  prisma: false
  protobufjs: false
  unrs-resolver: true

overrides:
  "@auth/core@<0.41.3": "0.41.3"
  "@babel/plugin-transform-modules-systemjs@<=7.29.3": "7.29.7"
  "@grpc/grpc-js@>=1.14.0 <1.14.4": "1.14.4"
  "@opentelemetry/propagator-jaeger@<2.9.0": "2.9.0"
  "@xmldom/xmldom@<0.8.13": "0.8.13"
  "ajv@>=8 <9": "8.20.0"
  "axios@>=1 <1.18.0": "1.18.0"
  "brace-expansion@<5.0.8": "5.0.9"
  "engine.io@>=4.1.0 <6.6.9": "6.6.9"
  "fast-uri@>=3 <3.1.5": "3.1.5"
  "fast-xml-parser@>=4 <5": "4.5.5"
  "fast-xml-parser@>=5 <5.10.1": "5.10.1"
  "flatted@<3.4.4": "3.4.4"
  "form-data@>=3 <4": "3.0.5"
  "form-data@>=4 <5": "4.0.6"
  "handlebars@4.7.8": "4.7.9"
  "hono@<4.12.25": "4.12.25"
  "ip-address@<=10.3.0": "10.3.1"
  "js-yaml@>=3 <4": "3.15.1"
  "js-yaml@>=4 <5": "4.3.1"
  "jws@<3.2.3": "3.2.3"
  "lodash@>=4 <4.18.0": "4.18.0"
  "minimatch@<3.1.4": "3.1.4"
  "minimatch@>=5 <6": "5.1.8"
  "minimatch@>=8 <9": "8.0.6"
  "minimatch@>=9 <10": "9.0.7"
  "multer@<2.2.0": "2.2.0"
  "nanoid@<3.3.18": "3.3.18"
  "node-forge@<1.4.0": "1.4.0"
  "path-to-regexp@<0.1.13": "0.1.13"
  "picomatch@<3": "2.3.2"
  "picomatch@>=3 <4": "3.0.2"
